<!DOCTYPE html>
<html>
   <title>Contoh CSS Tabel</title>
<head>
<style>
    #mahasiswa {
        font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
    }

    #mahasiswa td, #mahasiswa th {
        border: 1px solid #ddd;
        padding: 8px;
    }

    #mahasiswa tr:nth-child(even){background-color: #f2f2f2;}

    #mahasiswa tr:hover {background-color: #ddd;}

    #mahasiswa th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #0033CC;
        color: white;
    }
</style>
</head>
<body>

<table id="mahasiswa">
    <tr>
        <th>NIM</th>
        <th>Nama Lengkap</th>
        <th>Alamat</th>
    </tr>
    <tr>
        <td>18082317</td>
        <td>Muhammad Mizarudzorif Farid</td>
        <td>Tasikmalaya</td>
    </tr>
    <tr>
        <td>18082318</td>
        <td>Dzimar Muhammad Rauhillah Farid</td>
        <td>Ciamis</td>
    </tr>

</table>

</body>
</html>
