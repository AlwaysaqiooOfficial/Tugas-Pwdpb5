<!DOCTYPE html>
<html>
   <title>Contoh Font</title>
<head>
<style>
    p.warna {
        color: blue;
    }
    p.sansserif {
        font-family: Arial, Helvetica, sans-serif;
    }

    p.small {
        font-variant: small-caps;
    }
    p.weigth {
        font-weight: bold;
    }
    p.italic {
        font-style: italic;
    }
    p.size {
        font-size: 20px;
    }
</style>
</head>
<body>
    <p class="warna">Universitas Bina Sarana informatika</p>
    <p class="sansserif">Universitas Bina Sarana informatika</p>
    <p class="small">Universitas Bina Sarana informatika</p>
    <p class="weigth">Universitas Bina Sarana informatika</p>
    <p class="italic">Universitas Bina Sarana informatika</p>
    <p class="size">Universitas Bina Sarana informatika</p>

</body>
</html>
