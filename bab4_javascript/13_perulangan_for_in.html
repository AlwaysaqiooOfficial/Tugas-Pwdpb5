<!DOCTYPE html>
<html>
<body>

<h2>Contoh Perulangan For In</h2>

<p id="demo"></p>

<script>
var txt = "";
var mahasiswa = {Nama:"Dzimar Rauhillah", Alamat:"Tasikmalaya", Usia:17};
var x;
for (x in mahasiswa) {
    txt += mahasiswa[x] + " ";
}
document.getElementById("demo").innerHTML = txt;
</script>

</body>
</html>
